<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Rent & Property Manager Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 flex items-center justify-center min-h-screen px-4">
    <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl max-w-sm w-full shadow-2xl space-y-6">
        <div class="text-center space-y-1">
            <h1 class="text-2xl font-black text-indigo-400">Rent Manager Pro</h1>
            <p class="text-xs text-slate-400">Owner Portal • Login</p>
        </div>

        {% if error %}
        <div class="bg-rose-950/60 border border-rose-600/50 text-rose-300 text-xs p-3 rounded-lg text-center font-medium">
            {{ error }}
        </div>
        {% endif %}

        <form action="/login" method="POST" class="space-y-4 text-xs">
            <div>
                <label class="block text-slate-400 font-bold uppercase mb-1">Username</label>
                <input type="text" name="username" required placeholder="Username dalein" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-white text-sm">
            </div>
            <div>
                <label class="block text-slate-400 font-bold uppercase mb-1">Password</label>
                <input type="password" name="password" required placeholder="••••••••" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-white text-sm">
            </div>

            <div class="flex items-center justify-between text-[11px]">
                <label class="flex items-center gap-1.5 text-slate-400 cursor-pointer">
                    <input type="checkbox" name="remember_me" class="rounded bg-slate-950 border-slate-700 text-indigo-600"> Remember Me
                </label>
                <a href="/reset-password" class="text-indigo-400 hover:text-indigo-300 font-semibold">Forgot Password?</a>
            </div>

            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 font-bold py-2.5 rounded-lg text-white text-sm transition-all shadow-lg shadow-indigo-900/30">
                Sign In
            </button>
        </form>

        <div class="text-center pt-2 border-t border-slate-800 text-[11px] text-slate-500">
            🔒 Private Owner Portal (Public Signup Disabled)
        </div>
    </div>
</body>
</html>
