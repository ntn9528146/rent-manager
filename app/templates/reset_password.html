<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password via OTP - Rent Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 flex items-center justify-center min-h-screen px-4">
    <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl max-w-md w-full shadow-2xl space-y-6">
        <div class="text-center space-y-1">
            <div class="inline-flex p-3 bg-indigo-950/60 text-indigo-400 border border-indigo-600/40 rounded-full mb-2 text-xl">
                📩
            </div>
            <h1 class="text-2xl font-black text-indigo-400">Reset Password</h1>
            <p class="text-xs text-slate-400">Aapke Gmail par 6-digit ka secure OTP aayega</p>
        </div>

        {% if error %}
        <div class="bg-rose-950/60 border border-rose-600/50 text-rose-300 text-xs p-3 rounded-lg text-center font-semibold">
            {{ error }}
        </div>
        {% endif %}

        {% if msg %}
        <div class="bg-emerald-950/60 border border-emerald-600/50 text-emerald-300 text-xs p-3 rounded-lg text-center font-semibold">
            {{ msg }}
        </div>
        {% endif %}

        {% if not otp_sent %}
        <!-- STEP 1: ENTER USERNAME & EMAIL TO RECEIVE OTP -->
        <form action="/request-otp" method="POST" class="space-y-4 text-xs">
            <div>
                <label class="block text-slate-400 font-bold uppercase mb-1">Registered Username</label>
                <input type="text" name="username" value="{{ username or '' }}" required placeholder="Username dalein" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-white text-sm">
            </div>
            <div>
                <label class="block text-slate-400 font-bold uppercase mb-1">Registered Gmail ID</label>
                <input type="email" name="email" required placeholder="ntn9528146@gmail.com" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-white text-sm">
            </div>

            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 font-bold py-2.5 rounded-lg text-white text-sm transition-all shadow-lg shadow-indigo-900/30">
                Send 6-Digit OTP 📩
            </button>
        </form>
        {% else %}
        <!-- STEP 2: VERIFY OTP & ENTER NEW PASSWORD -->
        <form action="/verify-otp-reset" method="POST" class="space-y-4 text-xs">
            <input type="hidden" name="username" value="{{ username }}">
            <div>
                <label class="block text-amber-400 font-bold uppercase mb-1">Enter 6-Digit OTP (Check Gmail) 🔑</label>
                <input type="text" name="otp" maxlength="6" required placeholder="XXXXXX" class="w-full text-center tracking-widest text-xl font-black bg-slate-950 border border-amber-500 rounded-lg p-2.5 text-amber-300">
            </div>

            <div>
                <label class="block text-slate-400 font-bold uppercase mb-1">Naya Password</label>
                <input type="password" name="new_password" required placeholder="Naya password dalein" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-white text-sm">
            </div>

            <div>
                <label class="block text-slate-400 font-bold uppercase mb-1">Confirm Naya Password</label>
                <input type="password" name="confirm_password" required placeholder="Dobara naya password dalein" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-white text-sm">
            </div>

            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 font-bold py-2.5 rounded-lg text-white text-sm transition-all shadow-lg shadow-emerald-900/30">
                Verify OTP & Save Password
            </button>
        </form>
        {% endif %}

        <div class="text-center pt-2 border-t border-slate-800">
            <a href="/login" class="text-xs text-indigo-400 hover:text-indigo-300 font-semibold">Yaad aa gaya? Log In karein</a>
        </div>
    </div>
</body>
</html>
