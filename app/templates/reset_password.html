<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Rent Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 flex items-center justify-center min-h-screen px-4">
    <div class="max-w-md w-full bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-extrabold text-amber-400">Reset Password</h1>
            <p class="text-xs text-slate-400 mt-1">Apna username enter karke naya password set karein</p>
        </div>

        {% if error %}
        <div class="bg-rose-500/20 border border-rose-500 text-rose-300 px-4 py-2 rounded-lg text-xs mb-4">
            {{ error }}
        </div>
        {% endif %}
        {% if msg %}
        <div class="bg-emerald-500/20 border border-emerald-500 text-emerald-300 px-4 py-2 rounded-lg text-xs mb-4">
            {{ msg }}
        </div>
        {% endif %}

        <form action="/reset-password" method="POST" class="space-y-4 text-xs">
            <div>
                <label class="block uppercase tracking-wider text-slate-400 font-bold mb-1">Registered Username</label>
                <input type="text" name="username" required autofocus placeholder="Apna username dalein" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-indigo-500 text-sm">
            </div>
            <div>
                <label class="block uppercase tracking-wider text-slate-400 font-bold mb-1">Naya Password</label>
                <div class="relative">
                    <input type="password" id="new_password" name="new_password" required placeholder="Naya password dalein" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 pr-10 text-white focus:outline-none focus:border-indigo-500 text-sm">
                    <button type="button" onclick="togglePass('new_password', 'eye1')" class="absolute right-3 top-2.5 text-slate-400 hover:text-white">
                        <span id="eye1">👁️</span>
                    </button>
                </div>
            </div>
            <div>
                <label class="block uppercase tracking-wider text-slate-400 font-bold mb-1">Confirm Naya Password</label>
                <div class="relative">
                    <input type="password" id="confirm_password" name="confirm_password" required placeholder="Dobara naya password dalein" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 pr-10 text-white focus:outline-none focus:border-indigo-500 text-sm">
                    <button type="button" onclick="togglePass('confirm_password', 'eye2')" class="absolute right-3 top-2.5 text-slate-400 hover:text-white">
                        <span id="eye2">👁️</span>
                    </button>
                </div>
            </div>
            <button type="submit" class="w-full bg-amber-600 hover:bg-amber-500 font-bold py-2.5 rounded-lg text-white transition shadow-lg shadow-amber-900/40 text-sm">
                Update Password
            </button>
        </form>

        <p class="text-center text-xs text-slate-400 mt-6">
            Yaad aa gaya? <a href="/login" class="text-indigo-400 font-semibold hover:underline">Log In karein</a>
        </p>
    </div>

    <script>
        function togglePass(inputId, eyeId) {
            const input = document.getElementById(inputId);
            const eye = document.getElementById(eyeId);
            if (input.type === "password") {
                input.type = "text";
                eye.innerText = "🙈";
            } else {
                input.type = "password";
                eye.innerText = "👁️";
            }
        }
    </script>
</body>
</html>
